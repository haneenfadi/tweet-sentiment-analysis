version: "3.8"

services:
  fastapi:
    build: .
    container_name: tweet-sentiment-api
    ports:
      - "8000:8000"       # Map container port 8000 to host 8000
    volumes:
      - .:/app            # Mount project directory for live code changes
    env_file:
      - .env  
    environment:
      - PYTHONUNBUFFERED=1

